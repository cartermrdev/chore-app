# Fixed project and container name so every worktree shares ONE Postgres
# container on a fixed port. Test runs isolate themselves by creating a
# uniquely named database each (see apps/api/test/harness.ts).
name: chore-app
services:
  db:
    image: postgres:17-alpine
    container_name: chore-app-db
    environment:
      POSTGRES_USER: chore
      POSTGRES_PASSWORD: chore
      POSTGRES_DB: postgres
    ports:
      - "54329:5432"
    volumes:
      - chore-app-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chore -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  chore-app-pgdata:
